<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>창의적체험활동 포트폴리오</title>
  <style>
    :root{
      --bg:#f4f7fc; --card:#fff; --text:#1f2937; --muted:#64748b; --line:#e2e8f0;
      --primary:#5f78e8; --primary2:#738ef6; --danger:#dc2626; --success:#15803d;
      --soft:#eef2ff; --soft2:#f8fafc; --yellow:#fffbeb; --shadow:0 20px 44px rgba(24,39,75,.10);
    }
    *{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:linear-gradient(180deg,#7e9fda 0,#8ca9df 220px,#eef3fb 220px,#f4f7fc 100%);color:var(--text);line-height:1.6}
    .page{max-width:1120px;margin:0 auto;padding:22px 18px 70px}.hero{background:linear-gradient(135deg,rgba(95,120,232,.96),rgba(133,151,232,.96));color:#fff;border-radius:30px;padding:28px;box-shadow:0 24px 50px rgba(81,105,202,.22);margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px);letter-spacing:-.04em;line-height:1.15}.hero p{margin:0;color:rgba(255,255,255,.88)}
    .card{background:var(--card);border:1px solid rgba(226,232,240,.95);border-radius:28px;box-shadow:var(--shadow);padding:24px}.login-card{max-width:520px;margin:-46px auto 0;position:relative}.section-title{margin:0 0 18px;font-size:24px;letter-spacing:-.04em}.center{text-align:center}.field{margin-bottom:15px}label{display:block;font-weight:850;margin-bottom:8px;color:#334155}input,select{width:100%;min-height:52px;border:1px solid #dbe3f3;border-radius:999px;padding:13px 16px;font-size:16px;font-family:inherit;background:#f8fafc;outline:none}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(95,120,232,.13)}button{border:0;border-radius:999px;padding:13px 17px;min-height:48px;font-weight:850;font-size:15px;font-family:inherit;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 12px 22px rgba(95,120,232,.25)}.btn-secondary{background:#edf2ff;color:#5069dc}.btn-ghost{background:#f3f4f6;color:#475569}.btn-danger{background:#fff1f2;color:#991b1b}.btn-full{width:100%}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.message{display:none;margin-top:14px;padding:13px 15px;border-radius:16px;font-weight:750}.message.show{display:block}.message.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.message.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
    .role-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.role-option{position:relative}.role-option input{position:absolute;opacity:0}.role-option span{min-height:50px;display:flex;align-items:center;justify-content:center;border:1px solid #dbe3f3;border-radius:999px;background:#fff;font-weight:850;cursor:pointer}.role-option input:checked+span{background:var(--soft);color:var(--primary);border-color:var(--primary)}.login-visual{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}.visual-circle{width:82px;height:82px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 35% 30%,#fff 0,#eef2ff 60%,#dbe8ff 100%);box-shadow:0 12px 24px rgba(95,120,232,.18);border:6px solid rgba(255,255,255,.9)}.visual-mini{padding:6px 12px;font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--primary);background:#eef2ff;border-radius:999px}
    .top-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap}.user-box{background:#eef2ff;color:#5069dc;border-radius:18px;padding:12px 14px;font-weight:850}.panel-label{display:inline-flex;margin-bottom:8px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#5f78e8;font-size:11px;font-weight:950;letter-spacing:.08em}.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.module-card{padding:24px;border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:left}.module-card:hover{transform:translateY(-2px)}.module-icon{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:28px;margin-bottom:14px}.module-card h3{margin:0 0 6px;font-size:22px}.module-card p{margin:0;color:var(--muted);font-size:14px}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;background:#f8fafc;border:1px solid var(--line);border-radius:22px;padding:14px;margin-top:18px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.summary-item{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800}.entries{display:grid;gap:12px}.entry{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 28px rgba(24,39,75,.06);overflow:hidden}.entry-head{padding:16px;background:linear-gradient(180deg,#f8fbff,#f5f8fd);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.entry-title{margin:0;font-size:19px;letter-spacing:-.03em}.entry-meta{color:var(--muted);font-size:13px}.entry-body{padding:15px;display:grid;gap:12px}.entry-part{padding:12px;background:#f9fbff;border:1px solid var(--line);border-radius:16px}.entry-part h4{margin:0 0 5px;color:var(--primary);font-size:14px}.entry-part p{margin:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:14px}.empty{color:var(--muted);background:var(--yellow);border:1px solid #fde68a;border-radius:18px;padding:16px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal{width:min(500px,100%);background:#fff;border-radius:24px;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:22px}.modal h2{margin:0 0 8px}.modal p{margin:0 0 16px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.mobile-dock{display:none}
    @media(max-width:760px){body{background:linear-gradient(180deg,#7e9fda 0,#8ca9df 180px,#eef3fb 180px,#f4f7fc 100%)}.page{max-width:430px;padding:10px 12px 86px}.hero{min-height:150px;border-radius:28px;padding:18px 18px 44px;margin-bottom:0}.hero h1{font-size:24px;max-width:270px}.hero p{font-size:13px}.card{border-radius:28px;padding:18px}.login-card,#moduleView,#portfolioView>.card:first-child,#inquiryView>.card:first-child{margin-top:-28px;position:relative}.module-grid{grid-template-columns:1fr}.top-bar{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{width:100%;font-size:14px}.filters{grid-template-columns:1fr}.entry-head{display:block}.role-row{grid-template-columns:1fr 1fr}.modal-actions{display:grid;grid-template-columns:1fr}.modal-actions button{width:100%}.mobile-dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(92vw,390px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px 12px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid rgba(226,232,240,.8);box-shadow:0 18px 40px rgba(15,23,42,.14);border-radius:999px;z-index:20}.mobile-dock span{height:42px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#6b7fdc;background:#f5f7ff}.section-title{font-size:22px}.entry-part p{font-size:15px;line-height:1.7}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero"><h1>창의적체험활동 포트폴리오</h1><p>로그인 후 창체 포트폴리오와 탐구활동 따라하기를 선택해 기록을 저장합니다.</p></header>

    <section id="loginView" class="card login-card">
      <div class="login-visual"><div class="visual-circle">👤</div><div class="visual-mini">Creative Portfolio</div></div>
      <h2 class="section-title center">로그인</h2>
      <div class="role-row"><label class="role-option"><input type="radio" name="role" value="student" checked><span>학생</span></label><label class="role-option"><input type="radio" name="role" value="admin"><span>관리자</span></label></div>
      <div class="field"><label for="loginId">학번 또는 관리자 아이디</label><input type="text" id="loginId" placeholder="학생: 30101 / 관리자: admin"></div>
      <div class="field"><label for="loginPassword">비밀번호</label><input type="password" id="loginPassword" inputmode="numeric" maxlength="20" placeholder="비밀번호 입력"></div>
      <button id="loginBtn" class="btn-primary btn-full">로그인</button>
      <button id="openSignupBtn" class="btn-secondary btn-full" style="margin-top:9px">가입하기</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section id="moduleView" class="hidden">
      <div class="card">
        <div class="top-bar"><div><div class="panel-label">SELECT MENU</div><h2 class="section-title" style="margin-bottom:8px">활동 선택</h2><div id="moduleUserBox" class="user-box"></div></div><div class="actions"><button id="changePasswordBtn" class="btn-secondary">비밀번호 변경</button><button id="logoutBtn" class="btn-danger">로그아웃</button></div></div>
        <div class="module-grid" style="margin-top:18px"><button class="module-card" id="openInquiryBtn"><div class="module-icon">🔬</div><h3>탐구활동 따라하기</h3><p>탐구활동 보고서를 사이트에 저장하고 이어 작성합니다.</p></button><button class="module-card" id="openPortfolioBtn"><div class="module-icon">📚</div><h3>창체 포트폴리오</h3><p>창의적체험활동 기록을 작성하고 확인합니다.</p></button></div>
      </div>
    </section>

    <section id="portfolioView" class="hidden">
      <div class="card"><div class="top-bar"><div><div class="panel-label">CREATIVE ACTIVITY</div><h2 class="section-title" style="margin-bottom:8px">창체 포트폴리오</h2><div id="portfolioUserBox" class="user-box"></div></div><div class="actions"><button class="btn-ghost" onclick="showModuleHome()">← 선택 화면</button><button id="writeBtn" class="btn-primary">새 글 작성하기</button><button id="printBtn" class="btn-secondary">인쇄/PDF</button></div></div><div class="filters"><div><label for="sortBy">정렬 기준</label><select id="sortBy"><option value="dateDesc">날짜순: 최신순</option><option value="dateAsc">날짜순: 오래된순</option><option value="studentAsc">학번순: 오름차순</option><option value="studentDesc">학번순: 내림차순</option></select></div><div><label for="typeFilter">활동 유형</label><select id="typeFilter"><option value="">전체</option><option value="학급특색활동">학급특색활동</option><option value="학급회의">학급회의</option><option value="독서활동">독서활동</option><option value="봉사활동">봉사활동</option><option value="동아리활동">동아리활동</option><option value="기타">기타</option></select></div><button id="reloadBtn" class="btn-ghost">새로고침</button></div><div class="summary" id="summaryBox"></div></div><div id="entries" class="entries" style="margin-top:14px"></div>
    </section>

    <section id="inquiryView" class="hidden">
      <div class="card"><div class="top-bar"><div><div class="panel-label">INQUIRY REPORT</div><h2 class="section-title" style="margin-bottom:8px">탐구활동 따라하기</h2><div id="inquiryUserBox" class="user-box"></div></div><div class="actions"><button class="btn-ghost" onclick="showModuleHome()">← 선택 화면</button><button id="newInquiryBtn" class="btn-primary">새로 작성하기</button><button id="reloadInquiryBtn" class="btn-secondary">새로고침</button></div></div><div class="summary" id="inquirySummary"></div></div><div id="inquiryEntries" class="entries" style="margin-top:14px"></div>
    </section>

    <div id="signupModal" class="modal-backdrop hidden"><div class="modal"><h2>가입하기</h2><p class="muted">학번은 30XXX 형태로 입력합니다. 비밀번호는 숫자 4자리만 가능하며, 생년월일·전화번호 등 개인정보와 무관한 번호로 설정하세요.</p><div class="field"><label>학번(ID)</label><input id="signupId" inputmode="numeric" maxlength="5" placeholder="예: 30101"></div><div class="field"><label>이름</label><input id="signupName" placeholder="이름 입력"></div><div class="field"><label>비밀번호</label><input id="signupPassword" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리"></div><div id="signupMessage" class="message"></div><div class="modal-actions"><button id="cancelSignupBtn" class="btn-ghost">취소</button><button id="signupBtn" class="btn-primary">가입하기</button></div></div></div>
    <div id="passwordModal" class="modal-backdrop hidden"><div class="modal"><h2>비밀번호 변경</h2><p class="muted">새 비밀번호는 숫자 4자리만 가능합니다.</p><div class="field"><label>현재 비밀번호</label><input id="currentPassword" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>새 비밀번호</label><input id="newPassword" type="password" inputmode="numeric" maxlength="4"></div><div class="field"><label>새 비밀번호 확인</label><input id="newPasswordConfirm" type="password" inputmode="numeric" maxlength="4"></div><div id="passwordMessage" class="message"></div><div class="modal-actions"><button id="cancelPasswordBtn" class="btn-ghost">취소</button><button id="submitPasswordBtn" class="btn-primary">변경하기</button></div></div></div>
    <div class="mobile-dock" aria-hidden="true"><span>⌂</span><span>☰</span><span>✎</span><span>⚙</span></div>
  </main>
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxIF7YJlJ8bMuKfrRaQoi2iQm7sEahChAHboPZToUVAYdemDe8eXgSaEjfSu8mMuUghPw/exec";
    const $ = (id)=>document.getElementById(id);
    let session=null, entries=[], inquiryEntries=[];
    const views=['loginView','moduleView','portfolioView','inquiryView'];
    function show(id){views.forEach(v=>$(v).classList.toggle('hidden',v!==id));}
    function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    function fmt(v){if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
    function msg(el,type,text){el.className=`message show ${type}`;el.textContent=text}
    async function apiPost(payload){const res=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify(payload)});return await res.json()}
    function ensureUrl(){if(!WEB_APP_URL){msg($('loginMessage'),'error','index.html의 WEB_APP_URL에 Apps Script 웹앱 주소를 넣어주세요.');return false}return true}
    $('loginBtn').onclick=login; $('loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};
    $('openSignupBtn').onclick=()=>{$('signupModal').classList.remove('hidden');$('signupMessage').className='message'};
    $('cancelSignupBtn').onclick=()=>$('signupModal').classList.add('hidden'); $('signupBtn').onclick=signup;
    ['signupId','signupPassword','currentPassword','newPassword','newPasswordConfirm'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=e.target.value.replace(/[^0-9]/g,'')));
    $('logoutBtn').onclick=logout; $('openPortfolioBtn').onclick=()=>{showPortfolio();loadPortfolio()}; $('openInquiryBtn').onclick=()=>{showInquiry();loadInquiry()};
    $('writeBtn').onclick=()=>{if(!session||session.role!=='student')return;location.href=`write.html?${new URLSearchParams({token:session.token,role:session.role,studentId:session.studentId,studentName:session.studentName})}`};
    $('printBtn').onclick=()=>window.print(); $('reloadBtn').onclick=loadPortfolio; $('sortBy').onchange=renderPortfolio; $('typeFilter').onchange=renderPortfolio;
    $('newInquiryBtn').onclick=()=>openInquiryEditor(null); $('reloadInquiryBtn').onclick=loadInquiry;
    $('changePasswordBtn').onclick=()=>{$('passwordModal').classList.remove('hidden');$('passwordMessage').className='message'}; $('cancelPasswordBtn').onclick=()=>$('passwordModal').classList.add('hidden'); $('submitPasswordBtn').onclick=changePassword;
    restoreSession();
    function restoreSession(){const raw=localStorage.getItem('creativePortfolioSession');if(!raw){show('loginView');return}try{session=JSON.parse(raw);showModuleHome()}catch{localStorage.removeItem('creativePortfolioSession');show('loginView')}}
    function showModuleHome(){if(!session){show('loginView');return}show('moduleView');$('moduleUserBox').textContent=session.role==='admin'?`관리자 ${session.displayName||'admin'}님`:`${session.studentId} ${session.studentName}님`; $('changePasswordBtn').classList.toggle('hidden',session.role==='admin')}
    async function signup(){if(!ensureUrl())return;const id=$('signupId').value.trim(), name=$('signupName').value.trim(), pw=$('signupPassword').value.trim(); if(!/^30\d{3}$/.test(id)){msg($('signupMessage'),'error','학번은 30XXX 형태여야 합니다. 예: 30101');return} if(!name){msg($('signupMessage'),'error','이름을 입력해주세요.');return} if(!/^\d{4}$/.test(pw)){msg($('signupMessage'),'error','비밀번호는 숫자 4자리여야 합니다.');return} const r=await apiPost({action:'signup',studentId:id,studentName:name,password:pw}); if(!r.ok){msg($('signupMessage'),'error',r.message||'가입 실패');return} msg($('signupMessage'),'success','가입되었습니다. 이제 로그인할 수 있습니다.'); $('loginId').value=id; setTimeout(()=>$('signupModal').classList.add('hidden'),900)}
    async function login(){if(!ensureUrl())return;const role=document.querySelector('input[name="role"]:checked').value,id=$('loginId').value.trim(),password=$('loginPassword').value.trim();if(!id||!password){msg($('loginMessage'),'error','아이디와 비밀번호를 입력해주세요.');return}try{const r=await apiPost({action:'login',role,id,password});if(!r.ok){msg($('loginMessage'),'error',r.message||'로그인 실패');return}session={token:r.token,role:r.role,studentId:r.studentId||'',studentName:r.studentName||'',displayName:r.displayName||''};localStorage.setItem('creativePortfolioSession',JSON.stringify(session));showModuleHome()}catch(e){msg($('loginMessage'),'error','로그인 중 오류가 발생했습니다. 웹앱 주소와 배포 권한을 확인해주세요.')}}
    function logout(){session=null;localStorage.removeItem('creativePortfolioSession');show('loginView');$('loginPassword').value=''}
    async function changePassword(){const cur=$('currentPassword').value.trim(),np=$('newPassword').value.trim(),cf=$('newPasswordConfirm').value.trim();if(!/^\d{4}$/.test(cur)||!/^\d{4}$/.test(np)){msg($('passwordMessage'),'error','비밀번호는 숫자 4자리여야 합니다.');return}if(np!==cf){msg($('passwordMessage'),'error','새 비밀번호 확인이 일치하지 않습니다.');return}const r=await apiPost({action:'changePassword',token:session.token,currentPassword:cur,newPassword:np});if(!r.ok){msg($('passwordMessage'),'error',r.message||'변경 실패');return}msg($('passwordMessage'),'success','변경되었습니다. 다시 로그인해주세요.');setTimeout(logout,900)}
    function showPortfolio(){show('portfolioView');$('portfolioUserBox').textContent=session.role==='admin'?'관리자 전체 보기':`${session.studentId} ${session.studentName}님의 창체 기록`; $('writeBtn').classList.toggle('hidden',session.role==='admin')}
    async function loadPortfolio(){if(!session)return;$('entries').innerHTML='<div class="card empty">기록을 불러오는 중입니다.</div>';const r=await apiPost({action:'listEntries',token:session.token});if(!r.ok){$('entries').innerHTML=`<div class="card empty">${escapeHtml(r.message||'불러오기 실패')}</div>`;return}entries=r.entries||[];renderPortfolio()}
    function renderPortfolio(){let list=[...entries],filter=$('typeFilter').value;if(filter)list=list.filter(e=>String(e.activityType||'').startsWith(filter));const sort=$('sortBy').value;list.sort((a,b)=>sort==='dateAsc'?String(a.activityDate||'').localeCompare(String(b.activityDate||'')):sort==='studentAsc'?String(a.studentId||'').localeCompare(String(b.studentId||'')):sort==='studentDesc'?String(b.studentId||'').localeCompare(String(a.studentId||'')):String(b.activityDate||'').localeCompare(String(a.activityDate||'')));$('summaryBox').innerHTML=`<div class="summary-item">총 ${list.length}건</div><div class="summary-item">${session.role==='admin'?'관리자 전체 보기':'내 기록만 보기'}</div>`; if(!list.length){$('entries').innerHTML='<div class="card empty">표시할 기록이 없습니다.</div>';return}$('entries').innerHTML=list.map(e=>`<article class="entry"><div class="entry-head"><div><h3 class="entry-title">${escapeHtml(e.topic||'활동 주제명 없음')}</h3><div class="entry-meta">${escapeHtml([`${e.studentId||''} ${e.studentName||''}`.trim(),e.activityDate,Array.isArray(e.periods)?e.periods.join(', ')+'교시':e.periods,e.activityType].filter(Boolean).join(' · '))}</div></div><div class="entry-meta">제출: ${escapeHtml(fmt(e.submittedAt))}</div></div><div class="entry-body">${part('내가 한 활동',e.activityContent)}${part('내가 한 행동과 의견',e.myAction)}${part('인상 깊었던 타인의 행동과 의견',e.peerAction)}${part('느낀 점과 새로 알게 된 점',e.reflection)}</div></article>`).join('')}
    function part(t,c){return `<section class="entry-part"><h4>${escapeHtml(t)}</h4><p>${escapeHtml(c||'')}</p></section>`}
    function showInquiry(){show('inquiryView');$('inquiryUserBox').textContent=session.role==='admin'?'관리자: 모든 버전 보기':`${session.studentId} ${session.studentName}님의 최신 탐구 기록`; $('newInquiryBtn').classList.toggle('hidden',session.role==='admin')}
    async function loadInquiry(){if(!session)return;$('inquiryEntries').innerHTML='<div class="card empty">탐구활동 기록을 불러오는 중입니다.</div>';const r=await apiPost({action:'listInquiry',token:session.token});if(!r.ok){$('inquiryEntries').innerHTML=`<div class="card empty">${escapeHtml(r.message||'불러오기 실패')}</div>`;return}inquiryEntries=r.entries||[];renderInquiry()}
    function renderInquiry(){const list=[...inquiryEntries];$('inquirySummary').innerHTML=`<div class="summary-item">총 ${list.length}건</div><div class="summary-item">${session.role==='admin'?'모든 저장 버전 표시':'게시물별 최신 버전 표시'}</div>`; if(!list.length){$('inquiryEntries').innerHTML='<div class="card empty">아직 저장된 탐구활동 기록이 없습니다. 새로 작성하기를 눌러 시작하세요.</div>';return} $('inquiryEntries').innerHTML=list.map((e,i)=>`<article class="entry"><div class="entry-head"><div><h3 class="entry-title">${escapeHtml(e.topicTitle||'탐구 주제 없음')}</h3><div class="entry-meta">${escapeHtml([`${e.studentId||''} ${e.studentName||''}`.trim(),e.subject?`관련 교과: ${e.subject}`:'',`버전 ${e.version||1}`].filter(Boolean).join(' · '))}</div></div><div class="entry-meta">저장: ${escapeHtml(fmt(e.savedAt))}</div></div><div class="entry-body"><section class="entry-part"><h4>탐구 질문</h4><p>${escapeHtml((e.data&&e.data.planning&&e.data.planning.finalQ)||'')}</p></section>${session.role==='student'?`<button class="btn-primary" onclick="continueInquiry(${i})">이어 작성하기</button>`:''}</div></article>`).join('')}
    function openInquiryEditor(entry){if(session.role!=='student')return; if(entry){sessionStorage.setItem('inquiryDraftToLoad',JSON.stringify(entry));}else{sessionStorage.removeItem('inquiryDraftToLoad')} location.href=`inquiry.html?${new URLSearchParams({token:session.token,studentId:session.studentId,studentName:session.studentName,mode:entry?'continue':'new'})}`}
    function continueInquiry(i){openInquiryEditor(inquiryEntries[i])}
  </script>
</body>
</html>
